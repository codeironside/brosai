name: CI and production deploy

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build backend
        working-directory: backend
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Install, typecheck, and build frontend
        working-directory: frontend
        env:
          VITE_GOOGLE_CLIENT_ID: 107926694606-9obo130a9mhfcfv2psn3em3b9050a9cd.apps.googleusercontent.com
        run: |
          npm ci --legacy-peer-deps
          npm run lint
          npm run build

      - name: Upload release artifacts
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release
          retention-days: 7
          path: |
            backend/dist
            backend/package.json
            backend/package-lock.json
            backend/.npmrc
            frontend/dist
            deploy

  deploy:
    name: Deploy to VPS
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production-vps
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "${VPS_SSH_KNOWN_HOSTS}" ]; then
            echo "${VPS_SSH_KNOWN_HOSTS}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${VPS_PORT:-22}" -t ed25519,rsa "${VPS_HOST}" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Rsync release to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          PORT="${VPS_PORT:-22}"
          RSH="ssh -p ${PORT} -o StrictHostKeyChecking=yes"
          ssh -p "${PORT}" -o StrictHostKeyChecking=yes "${VPS_USER}@${VPS_HOST}" 'mkdir -p ~/brosai-incoming/backend/dist ~/brosai-incoming/frontend/dist ~/brosai-incoming/deploy'
          rsync -az --delete -e "$RSH" backend/dist/ "${VPS_USER}@${VPS_HOST}:brosai-incoming/backend/dist/"
          rsync -az -e "$RSH" backend/package.json backend/package-lock.json backend/.npmrc "${VPS_USER}@${VPS_HOST}:brosai-incoming/backend/"
          rsync -az --delete -e "$RSH" frontend/dist/ "${VPS_USER}@${VPS_HOST}:brosai-incoming/frontend/dist/"
          rsync -az --delete -e "$RSH" deploy/ "${VPS_USER}@${VPS_HOST}:brosai-incoming/deploy/"

      - name: Restart services and health-check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -p "${VPS_PORT:-22}" -o StrictHostKeyChecking=yes "${VPS_USER}@${VPS_HOST}" bash -s <<'EOF'
set -euo pipefail
if sudo -n /usr/bin/bash /home/deploy/brosai-incoming/deploy/brosai-release; then
  exit 0
fi
if sudo -n /bin/bash /home/deploy/brosai-incoming/deploy/brosai-release; then
  exit 0
fi
if sudo -n /usr/local/bin/brosai-release; then
  exit 0
fi
echo "sudo is not allowed yet. On the VPS run this once as tobi/admin:"
echo "echo 'deploy ALL=(root) NOPASSWD: /usr/bin/bash /home/deploy/brosai-incoming/deploy/brosai-release' | sudo tee /etc/sudoers.d/brosai-incoming && sudo chmod 440 /etc/sudoers.d/brosai-incoming"
exit 1
EOF

      - name: Verify public HTTPS
        run: |
          for url in https://api.vamvamvamai.com/health https://vamvamvamai.com/; do
            echo "Checking ${url}"
            curl -fsSI --max-time 30 "${url}" | head -n 20
          done
