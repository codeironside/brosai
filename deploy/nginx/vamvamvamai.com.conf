# HTTP first. certbot --nginx will add TLS and redirect.
# Do not also run Caddy — nginx already owns :80 and :443.

map $sent_http_content_type $expires {
    default                    off;
    ~*application/javascript   1y;
    ~*text/css                 1y;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.vamvamvamai.com;
    return 301 http://vamvamvamai.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name vamvamvamai.com;

    root /opt/brosai/frontend/dist;
    index index.html;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3124;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3124/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
